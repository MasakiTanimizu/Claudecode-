name: shared_protocol CI

on:
  push:
    branches:
      - "**"
    paths:
      - "packages/shared_protocol/**"
      - "packages/mahjong_engine/**"
      - ".github/workflows/shared_protocol-ci.yml"
  pull_request:
    paths:
      - "packages/shared_protocol/**"
      - "packages/mahjong_engine/**"
      - ".github/workflows/shared_protocol-ci.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared_protocol
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      # Non-blocking for the same reason as mahjong_engine-ci.yml: written
      # without a local Dart toolchain to run the formatter against.
      - run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true
      - run: dart analyze --fatal-infos
      - run: dart test
