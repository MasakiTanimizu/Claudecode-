name: mahjong_engine CI

on:
  push:
    branches:
      - "**"
    paths:
      - "packages/mahjong_engine/**"
      - ".github/workflows/mahjong_engine-ci.yml"
  pull_request:
    paths:
      - "packages/mahjong_engine/**"
      - ".github/workflows/mahjong_engine-ci.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mahjong_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
