name: mahjong_engine CI

on:
  push:
    branches:
      - "**"
    paths:
      - "packages/mahjong_engine/**"
      - ".github/workflows/mahjong_engine-ci.yml"
  pull_request:
    paths:
      - "packages/mahjong_engine/**"
      - ".github/workflows/mahjong_engine-ci.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mahjong_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      # Non-blocking: written without a local Dart toolchain to run the
      # formatter against, so this only reports drift instead of failing
      # the build. Drop continue-on-error once `dart format .` has been
      # run for real and the repo is clean.
      - run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true
      - run: dart analyze --fatal-infos
      - run: dart test
